global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "trax-ai"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8001"]

  - job_name: "trax-api"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:9000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
