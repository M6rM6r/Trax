services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
      - ai
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_DEFAULT_LOCALE=ar
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:9000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=trax
      - DB_USERNAME=trax
      - DB_PASSWORD=trax_secret
      - JWT_SECRET=trax_jwt_secret_change_in_production
      - AI_SERVICE_URL=http://ai:8001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ..
      dockerfile: docker/ai.Dockerfile
    ports:
      - "8001:8001"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - REDIS_URL=redis://redis:6379/0
      - AI_CACHE_TTL=300
      - AI_LOG_LEVEL=INFO
    volumes:
      - trax-ai-models:/app/models/saved
    depends_on:
      - redis
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: trax
      MYSQL_USER: trax
      MYSQL_PASSWORD: trax_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - trax-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - trax-redis:/data
    restart: unless-stopped

volumes:
  trax-db:
  trax-redis:
  trax-ai-models:
