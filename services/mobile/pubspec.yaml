name: trax_employee
description: Trax employee companion app for attendance tracking and check-in.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  dio: ^5.7.0
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  intl: ^0.20.2
  connectivity_plus: ^6.0.5
  flutter_background_geolocation: ^4.15.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  skeletonizer: ^1.4.3
  fl_chart: ^0.69.2
  cached_network_image: ^3.4.1
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4
  local_auth: ^2.3.0
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.0
  web_socket_channel: ^3.0.1
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  easy_localization: ^3.0.7
  flutter_dotenv: ^5.2.1
  envied: ^1.1.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  envied_generator: ^1.1.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - .env
    - assets/translations/
